<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agent Monitor - 用量统计</title>
    
    <!-- ECharts -->
    <script src="https://cdn.jsdelivr.net/npm/echarts@5.4.3/dist/echarts.min.js"></script>
    
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }
        
        :root {
            /* DeepSeek 配色方案 */
            --primary: #0070F3;
            --accent: #EA4C89;
            --success: #1FC16B;
            --warning: #F6AD55;
            --background: #FFFFFF;
            --card-bg: #F3F5F6;
            --text-primary: #222222;
            --text-secondary: #666666;
            --text-muted: #999999;
            --border: #EEF0F2;
        }
        
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Microsoft YaHei", sans-serif;
            background: var(--background);
            color: var(--text-primary);
            line-height: 1.6;
        }
        
        .container {
            max-width: 1200px;
            margin: 0 auto;
            padding: 24px;
        }
        
        /* Header */
        header {
            margin-bottom: 32px;
        }
        
        h1 {
            font-size: 28px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 8px;
        }
        
        .subtitle {
            color: var(--text-muted);
            font-size: 14px;
        }
        
        /* 2列卡片布局 */
        .summary-cards {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
        }
        
        .card-title {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 16px;
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .card-value {
            font-size: 36px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .card-unit {
            font-size: 16px;
            color: var(--text-muted);
            margin-left: 4px;
        }
        
        /* 筛选器 */
        .filters {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 16px 20px;
            margin-bottom: 24px;
            display: flex;
            align-items: center;
            gap: 16px;
            flex-wrap: wrap;
        }
        
        .filter-group {
            display: flex;
            align-items: center;
            gap: 8px;
        }
        
        .filter-label {
            font-size: 14px;
            color: var(--text-secondary);
        }
        
        select {
            padding: 8px 32px 8px 12px;
            border: 1px solid var(--border);
            border-radius: 8px;
            background: var(--background);
            color: var(--text-primary);
            font-size: 14px;
            cursor: pointer;
            appearance: none;
            background-image: url("data:image/svg+xml;charset=UTF-8,%3csvg width='14' height='14' viewBox='0 0 14 14' fill='none' xmlns='http://www.w3.org/2000/svg'%3e%3cpath d='M11.8486 5.5L11.4238 5.92383L8.69727 8.65137C8.44157 8.90706 8.21562 9.13382 8.01172 9.29785C7.79912 9.46883 7.55595 9.61756 7.25 9.66602C7.08435 9.69222 6.91565 9.69222 6.75 9.66602C6.44405 9.61756 6.20088 9.46883 5.98828 9.29785C5.78438 9.13382 5.55843 8.90706 5.30273 8.65137L2.57617 5.92383L2.15137 5.5L3 4.65137L3.42383 5.07617L6.15137 7.80273C6.42595 8.07732 6.59876 8.24849 6.74023 8.3623C6.87291 8.46904 6.92272 8.47813 6.9375 8.48047C6.97895 8.48703 7.02105 8.48703 7.0625 8.48047C7.07728 8.47813 7.12709 8.46904 7.25977 8.3623C7.40124 8.24849 7.57405 8.07732 7.84863 7.80273L10.5762 5.07617L11 4.65137L11.8486 5.5Z' fill='%23838383'/%3e%3c/svg%3e");
            background-repeat: no-repeat;
            background-position: right 12px center;
            min-width: 120px;
        }
        
        select:focus {
            outline: 2px solid var(--primary);
            outline-offset: 0;
        }
        
        button {
            padding: 8px 16px;
            border: none;
            border-radius: 8px;
            background: var(--primary);
            color: white;
            font-size: 14px;
            font-weight: 500;
            cursor: pointer;
            transition: background 0.2s;
        }
        
        button:hover {
            background: #0060D9;
        }
        
        button:disabled {
            opacity: 0.5;
            cursor: not-allowed;
        }
        
        .btn-secondary {
            background: transparent;
            color: var(--text-secondary);
            border: 1px solid var(--border);
        }
        
        .btn-secondary:hover {
            background: var(--card-bg);
            color: var(--text-primary);
        }
        
        /* 统计卡片（3列） */
        .stats-cards {
            display: grid;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            margin-bottom: 24px;
        }
        
        .stat-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
        }
        
        .stat-label {
            font-size: 14px;
            color: var(--text-secondary);
            margin-bottom: 12px;
        }
        
        .stat-value {
            font-size: 28px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        /* 图表区域 */
        .chart-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 24px;
            margin-bottom: 24px;
        }
        
        .chart-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }
        
        .chart-title {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .chart-tabs {
            display: flex;
            gap: 8px;
        }
        
        .chart-tab {
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 14px;
            color: var(--text-secondary);
            background: transparent;
            cursor: pointer;
            border: none;
        }
        
        .chart-tab.active {
            background: var(--background);
            color: var(--text-primary);
            box-shadow: 0 2px 8px rgba(0, 0, 0, 0.08);
        }
        
        .chart-container {
            width: 100%;
            height: 400px;
        }
        
        /* 详细数据区域 */
        .details-section {
            margin-top: 32px;
        }
        
        .section-title {
            font-size: 18px;
            font-weight: 600;
            color: var(--text-primary);
            margin-bottom: 16px;
        }
        
        .model-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            margin-bottom: 16px;
        }
        
        .model-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 16px;
            cursor: pointer;
        }
        
        .model-name {
            font-size: 16px;
            font-weight: 600;
            color: var(--text-primary);
        }
        
        .model-cost {
            font-size: 18px;
            font-weight: 600;
            color: var(--accent);
        }
        
        .model-details {
            display: none;
            grid-template-columns: repeat(3, 1fr);
            gap: 16px;
            padding-top: 16px;
            border-top: 1px solid var(--border);
        }
        
        .model-details.show {
            display: grid;
        }
        
        .detail-item {
            display: flex;
            flex-direction: column;
        }
        
        .detail-label {
            font-size: 12px;
            color: var(--text-muted);
            margin-bottom: 4px;
        }
        
        .detail-value {
            font-size: 16px;
            font-weight: 500;
            color: var(--text-primary);
        }
        
        /* 加载状态 */
        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-muted);
        }
        
        .spinner {
            border: 3px solid var(--border);
            border-top: 3px solid var(--primary);
            border-radius: 50%;
            width: 40px;
            height: 40px;
            animation: spin 1s linear infinite;
            margin: 0 auto 16px;
        }
        
        @keyframes spin {
            0% { transform: rotate(0deg); }
            100% { transform: rotate(360deg); }
        }
        
        /* 响应式 */
        @media (max-width: 768px) {
            .summary-cards,
            .stats-cards {
                grid-template-columns: 1fr;
            }
            
            .filters {
                flex-direction: column;
                align-items: stretch;
            }
            
            .filter-group {
                width: 100%;
            }
            
            select {
                width: 100%;
            }
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Header -->
        <header>
            <h1>Agent Monitor</h1>
            <p class="subtitle">AI Agent 用量监控与费用统计</p>
        </header>
        
        <!-- 余额和累计消费（2列卡片） -->
        <div class="summary-cards">
            <div class="card">
                <div class="card-title">
                    累计消费金额
                </div>
                <div>
                    <span class="card-value" id="totalCost">0.00</span>
                    <span class="card-unit">CNY</span>
                </div>
            </div>
            
            <div class="card">
                <div class="card-title">
                    本周期消费
                </div>
                <div>
                    <span class="card-value" id="periodCost">0.00</span>
                    <span class="card-unit">CNY</span>
                </div>
            </div>
        </div>
        
        <!-- 筛选器 -->
        <div class="filters">
            <div class="filter-group">
                <span class="filter-label">时间维度</span>
                <select id="timeFilter" onchange="loadData()">
                    <option value="1">今天</option>
                    <option value="7">最近 7 天</option>
                    <option value="30" selected>最近 30 天</option>
                    <option value="90">最近 90 天</option>
                </select>
            </div>
            
            {% if multi_enabled and show_machine_filter %}
            <div class="filter-group">
                <span class="filter-label">机器</span>
                <select id="machineFilter" onchange="loadData()">
                    <option value="all">全部机器</option>
                    <!-- 动态加载 -->
                </select>
            </div>
            {% endif %}
            
            <div style="flex: 1"></div>
            
            {% if multi_enabled %}
            <button onclick="syncData()" id="syncBtn">
                🔄 同步数据
            </button>
            {% endif %}
            
            <button class="btn-secondary" onclick="clearCache()">
                清除缓存
            </button>
            
            <button class="btn-secondary" onclick="window.location.href='/config'">
                价格配置
            </button>
        </div>
        
        <!-- 统计卡片（3列） -->
        <div class="stats-cards">
            <div class="stat-card">
                <div class="stat-label">消费金额</div>
                <div class="stat-value" id="statCost">¥0.00</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-label">API 请求次数</div>
                <div class="stat-value" id="statRequests">0</div>
            </div>
            
            <div class="stat-card">
                <div class="stat-label">Tokens</div>
                <div class="stat-value" id="statTokens">0</div>
            </div>
        </div>
        
        <!-- 消费趋势图表 -->
        <div class="chart-card">
            <div class="chart-header">
                <div class="chart-title">消费金额（CNY）</div>
                <div class="chart-tabs">
                    <button class="chart-tab active" onclick="switchChart('model')">模型</button>
                    <button class="chart-tab" onclick="switchChart('provider')">Provider</button>
                </div>
            </div>
            <div id="costChart" class="chart-container"></div>
        </div>
        
        <!-- Tokens 图表 -->
        <div class="chart-card">
            <div class="chart-header">
                <div class="chart-title">Tokens 使用量</div>
            </div>
            <div id="tokensChart" class="chart-container"></div>
        </div>
        
        <!-- 详细数据 -->
        <div class="details-section">
            <h2 class="section-title">按模型详情</h2>
            <div id="modelDetails"></div>
        </div>
    </div>
    
    <script>
        let currentData = null;
        let currentChartType = 'model';
        let costChart = null;
        let tokensChart = null;
        
        // 初始化
        document.addEventListener('DOMContentLoaded', function() {
            loadMachines();
            loadData();
            
            // 初始化图表
            costChart = echarts.init(document.getElementById('costChart'));
            tokensChart = echarts.init(document.getElementById('tokensChart'));
        });
        
        // 加载机器列表
        async function loadMachines() {
            {% if multi_enabled %}
            try {
                const response = await fetch('/api/machines');
                const data = await response.json();
                
                if (data.enabled && data.machines) {
                    const select = document.getElementById('machineFilter');
                    data.machines.forEach(machine => {
                        const option = document.createElement('option');
                        option.value = machine.id;
                        option.textContent = machine.hostname || machine.id;
                        select.appendChild(option);
                    });
                }
            } catch (error) {
                console.error('Failed to load machines:', error);
            }
            {% endif %}
        }
        
        // 加载数据
        async function loadData() {
            const days = document.getElementById('timeFilter').value;
            const machine = document.getElementById('machineFilter')?.value || 'all';
            
            try {
                const response = await fetch(`/api/report?days=${days}&machine=${machine}`);
                currentData = await response.json();
                
                updateUI(currentData);
                updateCharts(currentData);
                updateModelDetails(currentData);
            } catch (error) {
                console.error('Failed to load data:', error);
                alert('加载数据失败');
            }
        }
        
        // 更新 UI
        function updateUI(data) {
            // 累计消费（这里用当前周期的2倍模拟）
            document.getElementById('totalCost').textContent = (data.total_cost_cny * 3).toFixed(2);
            document.getElementById('periodCost').textContent = data.total_cost_cny.toFixed(2);
            
            // 统计卡片
            document.getElementById('statCost').textContent = '¥' + data.total_cost_cny.toFixed(2);
            document.getElementById('statRequests').textContent = formatNumber(data.total_requests || 0);
            document.getElementById('statTokens').textContent = formatNumber(data.total_tokens || 0);
        }
        
        // 更新图表
        function updateCharts(data) {
            updateCostChart(data);
            updateTokensChart(data);
        }
        
        // 更新消费图表
        function updateCostChart(data) {
            const byData = currentChartType === 'model' ? data.by_model : data.by_provider;
            
            if (!byData) return;
            
            const items = Object.entries(byData)
                .map(([name, stats]) => ({
                    name,
                    value: stats.actual_cost_cny || stats.cost_cny || 0
                }))
                .sort((a, b) => b.value - a.value)
                .slice(0, 10);
            
            const option = {
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'shadow'
                    }
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    top: '3%',
                    containLabel: true
                },
                xAxis: {
                    type: 'value',
                    axisLabel: {
                        formatter: '¥{value}'
                    }
                },
                yAxis: {
                    type: 'category',
                    data: items.map(i => i.name).reverse()
                },
                series: [{
                    name: '消费金额',
                    type: 'bar',
                    data: items.map(i => i.value).reverse(),
                    itemStyle: {
                        color: '#0070F3'
                    }
                }]
            };
            
            costChart.setOption(option);
        }
        
        // 更新 Tokens 图表
        function updateTokensChart(data) {
            if (!data.by_model) return;
            
            const items = Object.entries(data.by_model)
                .map(([name, stats]) => ({
                    name,
                    input: stats.input_tokens || 0,
                    output: stats.output_tokens || 0,
                    reasoning: stats.reasoning_tokens || 0
                }))
                .sort((a, b) => (b.input + b.output + b.reasoning) - (a.input + a.output + a.reasoning))
                .slice(0, 10);
            
            const option = {
                tooltip: {
                    trigger: 'axis',
                    axisPointer: {
                        type: 'shadow'
                    }
                },
                legend: {
                    data: ['Input', 'Output', 'Reasoning']
                },
                grid: {
                    left: '3%',
                    right: '4%',
                    bottom: '3%',
                    top: '10%',
                    containLabel: true
                },
                xAxis: {
                    type: 'value',
                    axisLabel: {
                        formatter: function(value) {
                            if (value >= 1000000) return (value / 1000000).toFixed(1) + 'M';
                            if (value >= 1000) return (value / 1000).toFixed(1) + 'K';
                            return value;
                        }
                    }
                },
                yAxis: {
                    type: 'category',
                    data: items.map(i => i.name).reverse()
                },
                series: [
                    {
                        name: 'Input',
                        type: 'bar',
                        stack: 'total',
                        data: items.map(i => i.input).reverse(),
                        itemStyle: { color: '#A0DCFD' }
                    },
                    {
                        name: 'Output',
                        type: 'bar',
                        stack: 'total',
                        data: items.map(i => i.output).reverse(),
                        itemStyle: { color: '#60B3FE' }
                    },
                    {
                        name: 'Reasoning',
                        type: 'bar',
                        stack: 'total',
                        data: items.map(i => i.reasoning).reverse(),
                        itemStyle: { color: '#0C70F3' }
                    }
                ]
            };
            
            tokensChart.setOption(option);
        }
        
        // 切换图表类型
        function switchChart(type) {
            currentChartType = type;
            
            // 更新 tab 样式
            document.querySelectorAll('.chart-tab').forEach(tab => {
                tab.classList.remove('active');
            });
            event.target.classList.add('active');
            
            // 更新图表
            if (currentData) {
                updateCostChart(currentData);
            }
        }
        
        // 更新模型详情
        function updateModelDetails(data) {
            if (!data.by_model) return;
            
            const container = document.getElementById('modelDetails');
            container.innerHTML = '';
            
            const sorted = Object.entries(data.by_model)
                .sort(([,a], [,b]) => (b.actual_cost_cny || 0) - (a.actual_cost_cny || 0));
            
            sorted.forEach(([model, stats]) => {
                const card = document.createElement('div');
                card.className = 'model-card';
                card.innerHTML = `
                    <div class="model-header" onclick="toggleModelDetails(this)">
                        <div class="model-name">${model}</div>
                        <div class="model-cost">¥${(stats.actual_cost_cny || 0).toFixed(2)}</div>
                    </div>
                    <div class="model-details">
                        <div class="detail-item">
                            <span class="detail-label">请求次数</span>
                            <span class="detail-value">${formatNumber(stats.request_count || 0)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Input Tokens</span>
                            <span class="detail-value">${formatNumber(stats.input_tokens || 0)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Output Tokens</span>
                            <span class="detail-value">${formatNumber(stats.output_tokens || 0)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Reasoning Tokens</span>
                            <span class="detail-value">${formatNumber(stats.reasoning_tokens || 0)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Cache Read</span>
                            <span class="detail-value">${formatNumber(stats.cache_read_tokens || 0)}</span>
                        </div>
                        <div class="detail-item">
                            <span class="detail-label">Cache Write</span>
                            <span class="detail-value">${formatNumber(stats.cache_write_tokens || 0)}</span>
                        </div>
                    </div>
                `;
                container.appendChild(card);
            });
        }
        
        // 展开/折叠模型详情
        function toggleModelDetails(header) {
            const details = header.nextElementSibling;
            details.classList.toggle('show');
        }
        
        // 同步数据
        async function syncData() {
            const btn = document.getElementById('syncBtn');
            btn.disabled = true;
            btn.textContent = '同步中...';
            
            try {
                const response = await fetch('/api/sync', { method: 'POST' });
                const result = await response.json();
                
                if (result.success) {
                    alert('同步成功！');
                    loadData();
                } else {
                    alert('同步失败: ' + result.error);
                }
            } catch (error) {
                console.error('Sync failed:', error);
                alert('同步失败');
            } finally {
                btn.disabled = false;
                btn.textContent = '🔄 同步数据';
            }
        }
        
        // 清除缓存
        async function clearCache() {
            if (!confirm('确定清除缓存？')) return;
            
            try {
                const response = await fetch('/api/cache/clear', { method: 'POST' });
                const result = await response.json();
                
                if (result.success) {
                    alert('缓存已清除');
                    loadData();
                }
            } catch (error) {
                console.error('Failed to clear cache:', error);
                alert('清除缓存失败');
            }
        }
        
        // 格式化数字
        function formatNumber(n) {
            if (n >= 1000000) return (n / 1000000).toFixed(2) + 'M';
            if (n >= 1000) return (n / 1000).toFixed(2) + 'K';
            return n.toString();
        }
        
        // 响应式图表
        window.addEventListener('resize', function() {
            if (costChart) costChart.resize();
            if (tokensChart) tokensChart.resize();
        });
    </script>
</body>
</html>
