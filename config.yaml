# Agent Monitor Configuration
# 监控 Hermes 和 OpenCode 的 token 使用和费用

# 数据源配置
# db_path / config_path 支持三种写法：
#   auto  —— 按当前系统自动探测默认路径（推荐，一份配置跨 Windows/macOS/Linux 通用）
#   留空  —— 等价于 auto
#   绝对路径 —— 显式覆盖（含 ~ 或环境变量会自动展开）
# 各系统默认路径见 paths.py 里的 PLATFORM_DEFAULTS。
sources:
  hermes:
    enabled: true
    db_path: auto
    config_path: auto
    
  opencode:
    enabled: true
    db_path: auto
    config_path: auto

# 多机同步配置（新增）
multi_machine:
  enabled: true  # 启用多机数据聚合
  sync_dir: ~/.agent-monitor-sync  # 本地同步目录（Git 仓库）
  remote_url: ""  # Git 远程仓库 URL（留空则只本地，填写后自动 push/pull）
  # 示例: https://github.com/username/agent-monitor-data.git
  # 私有仓库需配置 SSH key 或 Personal Access Token
  
  auto_sync_on_start: true  # 启动时自动同步（pull → export → push）
  show_machine_filter: true  # Dashboard 显示机器筛选器

# 价格换算规则
pricing:
  # apiclaude 价格公式: actual CNY/M = standard USD/M * multiplier / 12
  # 或反推: standard USD/M = actual CNY/M * 12 / multiplier
  cny_to_usd_rate: 12  # 1 CNY = 12 USD (用户约定)
  
  # 标准 USD 价格（per million tokens）
  # 用于反推和验证
  standard_prices:
    # OpenAI 官方价格
    gpt-4o:
      input: 2.5
      output: 10.0
      cache_write: 3.75
      cache_read: 1.25
    
    gpt-4o-mini:
      input: 0.15
      output: 0.60
      cache_write: 0.225
      cache_read: 0.075
    
    o1-preview:
      input: 15.0
      output: 60.0
      cache_write: 22.5
      cache_read: 7.5
    
    o1-mini:
      input: 3.0
      output: 12.0
      cache_write: 4.5
      cache_read: 1.5
    
    # Anthropic Claude 官方价格
    claude-opus-5:
      input: 5.0
      output: 25.0
      cache_write: 6.25
      cache_read: 0.5
    
    claude-sonnet-5:
      input: 2.0
      output: 10.0
      cache_write: 2.5
      cache_read: 0.2
    
    claude-fable-5:
      input: 10.0
      output: 50.0
      cache_write: 12.5
      cache_read: 1.0
    
    # Moonshot Kimi
    kimi-k3:
      input: 0.1
      output: 0.1
    
    # DeepSeek 官方价格
    deepseek-v4-flash:
      input: 0.14
      output: 0.28
      cache_write: 0.07
      cache_read: 0.014
    
    deepseek-v4-pro:
      input: 1.0
      output: 2.0
      cache_write: 0.5
      cache_read: 0.1
  
  # Provider 倍率（apiclaude 分组）
  provider_multipliers:
    openai_2x: 2.2    # 实际是 2.2x
    anthropic_3x: 2.8  # 实际是 2.8x
    anthropic_18x: 18.0
    anthropic_1x: 1.0
    deepseek: 1.0
  
  # 价格覆盖（优先级最高）
  # 格式: model@provider
  # 直接填写实际 CNY/M 价格，覆盖计算结果
  price_overrides: {}
    # 示例：如果发现某个模型价格算得不对，在这里配置
    # gpt-5.6-sol@openai_2x:
    #   input: 0.92
    #   output: 5.5
    #   cache_write: 1.15
    #   cache_read: 0.092

# 监控配置
monitor:
  # 数据采集间隔（秒）
  poll_interval: 300  # 5分钟
  
  # 统计时间窗口（天）
  default_windows: [1, 7, 30, 90]
  
  # Web Dashboard 配置
  dashboard:
    enabled: true
    host: 127.0.0.1
    port: 8899
    auto_refresh_seconds: 60
  
  # 日志配置
  logging:
    level: INFO
    file: logs/monitor.log
    max_size_mb: 10
    backup_count: 5

# 告警配置（可选）
alerts:
  enabled: false
  # 日均消费超过阈值时告警
  daily_cost_threshold_cny: 50
  # token 使用超过阈值时告警
  daily_token_threshold: 10000000  # 10M tokens
